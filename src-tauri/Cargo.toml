[package]
name = "harness-trajectory-desktop"
version = "0.5.0"
description = "Local coding-agent session viewer"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
